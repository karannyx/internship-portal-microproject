{% extends "base.html" %}
{% block title %}Register | Skill2Career{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-5">
            <div class="card card-custom p-5">
                <h3 class="fw-bold text-center mb-1">Create Student Account</h3>
                <p class="text-muted text-center small mb-4">Register your skills with Firebase Auth</p>

                <div id="errorMessage" class="alert alert-danger py-2 small d-none"></div>

                <form id="regForm">
                    <div class="mb-3">
                        <label class="form-label fw-semibold small">Full Name</label>
                        <input type="text" id="name" class="form-control" placeholder="John Doe" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label fw-semibold small">Email Address</label>
                        <input type="email" id="email" class="form-control" placeholder="student@university.edu" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label fw-semibold small">Skills (comma-separated)</label>
                        <input type="text" id="skills" class="form-control" placeholder="Python, SQL, React, C" required>
                    </div>
                    <div class="mb-4">
                        <label class="form-label fw-semibold small">Secure Password</label>
                        <input type="password" id="password" class="form-control" placeholder="••••••••" required>
                    </div>
                    <button type="submit" id="regBtn" class="btn btn-primary-custom w-100 mb-3">Create Account</button>
                    <div class="text-center small">
                        Already have an account? <a href="/login" class="text-decoration-none fw-bold">Sign In</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
  import { getAuth, createUserWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-auth.js";

  const firebaseConfig = {
    apiKey: "AIzaSyD9BTtt9e8xNLjgZZg3onbVmpauo9S5y5c",
    authDomain: "skill2career-932d2.firebaseapp.com",
    projectId: "skill2career-932d2",
    storageBucket: "skill2career-932d2.firebasestorage.app",
    messagingSenderId: "27369538944",
    appId: "1:27369538944:web:9dd0d456f75bda54b86d65",
    measurementId: "G-WE5MKVWVEV"
  };

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);

  document.getElementById('regForm').addEventListener('submit', (e) => {
      e.preventDefault();
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;
      const name = document.getElementById('name').value;
      const skills = document.getElementById('skills').value;
      const btn = document.getElementById('regBtn');
      const errBox = document.getElementById('errorMessage');

      btn.innerHTML = "Creating Secure Profile...";
      errBox.classList.add('d-none');

      createUserWithEmailAndPassword(auth, email, password)
          .then((userCredential) => {
              fetch('/sync_firebase', {
                  method: 'POST',
                  headers: {'Content-Type': 'application/json'},
                  body: JSON.stringify({ action: 'register', email: email, name: name, skills: skills })
              }).then(() => window.location.href = '/jobs');
          })
          .catch((error) => {
              btn.innerHTML = "Create Account";
              errBox.innerHTML = error.message.replace("Firebase: ", "");
              errBox.classList.remove('d-none');
          });
  });
</script>
{% endblock %}
