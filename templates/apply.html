{% extends "base.html" %}
{% block title %}Post Internship | InternHub{% endblock %}
{% block content %}
<div class="container py-4">
    <div class="row justify-content-center">
        <div class="col-md-7 col-lg-5">
            <div class="card card-custom p-4 p-md-5">
                <h4 class="fw-bold mb-1 text-dark">Post an Opening</h4>
                <p class="text-muted small mb-4">List requirements to connect with verified students</p>
                <form method="POST">
                    <div class="mb-3">
                        <label class="form-label fw-semibold small">Role Title</label>
                        <input type="text" class="form-control" name="title" placeholder="Backend Engineering Intern" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label fw-semibold small">Company Name</label>
                        <input type="text" class="form-control" name="company" placeholder="Acme Technologies" required>
                    </div>
                    <div class="mb-4">
                        <label class="form-label fw-semibold small">Required Tech Skills</label>
                        <input type="text" class="form-control" name="required_skills" placeholder="Flask, Python, PostgreSQL" required>
                    </div>
                    <button type="submit" class="btn btn-primary-custom w-100 py-2">Publish Internship</button>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
