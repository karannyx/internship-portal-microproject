{% extends "base.html" %}
{% block title %}Apply for Position | InternHub{% endblock %}
{% block content %}
<div class="container py-4">
    <div class="row justify-content-center">
        <div class="col-md-6 col-lg-4">
            <div class="card card-custom p-4 p-md-5">
                <h4 class="fw-bold mb-1 text-dark">Submit Application</h4>
                <p class="text-muted small mb-4">Confirm your candidacy using your registered email</p>
                <form method="POST">
                    <div class="mb-4">
                        <label class="form-label fw-semibold small">Registered Student Email</label>
                        <input type="email" class="form-control" name="email" placeholder="student@university.edu" required>
                    </div>
                    <button type="submit" class="btn btn-primary-custom w-100 py-2">Submit Profile</button>
                    <a href="/jobs" class="btn btn-link w-100 text-muted mt-2 text-decoration-none small">Cancel</a>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
