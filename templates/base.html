<!DOCTYPE html>
<html lang="en" data-bs-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Skill2Career | Official Student Internship Portal{% endblock %}</title>
    
    <!-- Prevent Theme Flash -->
    <script>
        (function() {
            const savedTheme = localStorage.getItem('theme') || 'light';
            document.documentElement.setAttribute('data-bs-theme', savedTheme);
        })();
    </script>

    <!-- Google Fonts & Bootstrap Icons -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <!-- Bootstrap 5.3 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        /* ====================================================
           PREMIUM EMERALD & MINT (CAREER / GROWTH PALETTE)
           ==================================================== */
        :root {
            --primary: #059669;          /* Deep Rich Emerald */
            --primary-hover: #047857;
            --primary-light: #10b981;    /* Vibrant Mint Green */
            --primary-subtle: #ecfdf5;
            --accent-glow: rgba(16, 185, 129, 0.2);
        }

        /* LIGHT THEME (Crisp Clean Slate & Emerald Accent) */
        [data-bs-theme="light"] {
            --body-bg: #f8fafc;
            --nav-bg: #ffffff;
            --card-bg: #ffffff;
            --border-color: #e2e8f0;
            --text-heading: #0f172a;
            --text-body: #334155;
            --text-muted: #64748b;
            --card-shadow: 0 4px 6px -1px rgba(15, 23, 42, 0.04);
            --badge-bg: #ecfdf5;
            --badge-text: #059669;
        }

        /* DARK THEME (Deep Charcoal Slate & Neon Mint Glow) */
        [data-bs-theme="dark"] {
            --body-bg: #09100e;          /* Rich Deep Charcoal with subtle emerald tone */
            --nav-bg: #0d1714;          /* Sleek Dark Bar */
            --card-bg: #111e1a;          /* Elevated Emerald Surface */
            --border-color: #1a2f29;     /* Subtle Tinted Border */
            --text-heading: #f8fafc;     /* Clean Crisp White */
            --text-body: #cbd5e1;        /* High-Contrast Soft Slate */
            --text-muted: #94a3b8;
            --card-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5);
            --badge-bg: #14352b;
            --badge-text: #34d399;        /* Vivid Mint Text */
            --primary-subtle: #17382e;
        }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: var(--body-bg) !important;
            color: var(--text-body) !important;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            transition: background-color 0.25s ease, color 0.25s ease;
        }

        h1, h2, h3, h4, h5, h6 {
            color: var(--text-heading) !important;
            font-weight: 700;
            letter-spacing: -0.02em;
        }

        .text-muted {
            color: var(--text-muted) !important;
        }

        /* Navigation Bar */
        .navbar-custom {
            background: var(--nav-bg) !important;
            border-bottom: 1px solid var(--border-color);
            padding: 0.85rem 0;
            transition: background-color 0.25s ease, border-color 0.25s ease;
        }

        .navbar-brand {
            font-weight: 800;
            color: var(--primary-light) !important;
            letter-spacing: -0.5px;
            font-size: 1.25rem;
        }

        .nav-link {
            color: var(--text-body) !important;
            font-weight: 600;
            font-size: 0.92rem;
            transition: color 0.15s ease;
        }

        .nav-link:hover {
            color: var(--primary-light) !important;
        }

        /* Card System */
        .card, .card-custom {
            background-color: var(--card-bg) !important;
            border: 1px solid var(--border-color) !important;
            border-radius: 14px;
            box-shadow: var(--card-shadow);
            color: var(--text-body) !important;
            transition: transform 0.2s ease, border-color 0.2s ease, box-shadow 0.2s ease;
        }

        .card:hover, .card-custom:hover {
            border-color: var(--primary-light) !important;
            transform: translateY(-2px);
        }

        /* Premium Buttons */
        .btn-primary-custom {
            background: linear-gradient(135deg, #10b981, #059669) !important;
            color: #ffffff !important;
            border: none !important;
            font-weight: 600;
            border-radius: 9px;
            padding: 0.55rem 1.2rem;
            font-size: 0.9rem;
            box-shadow: 0 4px 14px rgba(16, 185, 129, 0.28);
            transition: all 0.2s ease;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            justify-content: center;
        }

        .btn-primary-custom:hover {
            background: linear-gradient(135deg, #059669, #047857) !important;
            transform: translateY(-1px);
            box-shadow: 0 6px 20px rgba(16, 185, 129, 0.38);
        }

        .btn-outline-custom {
            border: 1px solid var(--border-color) !important;
            color: var(--text-heading) !important;
            background: transparent;
            font-weight: 600;
            border-radius: 9px;
            padding: 0.55rem 1.1rem;
            font-size: 0.9rem;
            transition: all 0.2s ease;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            justify-content: center;
        }

        .btn-outline-custom:hover {
            background-color: var(--primary-subtle);
            border-color: var(--primary-light) !important;
            color: var(--primary-light) !important;
        }

        /* Badges */
        .badge-skill {
            background-color: var(--badge-bg) !important;
            color: var(--badge-text) !important;
            border: 1px solid var(--border-color);
            font-weight: 600;
            font-size: 0.75rem;
            padding: 0.35rem 0.65rem;
            border-radius: 6px;
        }

        /* Theme Toggle Button */
        .theme-toggle-btn {
            width: 38px;
            height: 38px;
            border-radius: 9px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            border: 1px solid var(--border-color);
            background: var(--card-bg);
            color: var(--text-heading);
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .theme-toggle-btn:hover {
            border-color: var(--primary-light);
            color: var(--primary-light);
        }

        /* Form Controls */
        .form-control {
            background-color: var(--card-bg) !important;
            border: 1px solid var(--border-color) !important;
            color: var(--text-heading) !important;
            border-radius: 9px;
        }

        .form-control:focus {
            border-color: var(--primary-light) !important;
            box-shadow: 0 0 0 0.2rem var(--accent-glow) !important;
        }

        footer {
            margin-top: auto;
            background: var(--nav-bg);
            border-top: 1px solid var(--border-color);
            padding: 1.4rem 0;
            font-size: 0.85rem;
            color: var(--text-muted);
        }
    </style>
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-custom sticky-top">
    <div class="container">
        <a class="navbar-brand d-flex align-items-center gap-2" href="/">
            <i class="bi bi-briefcase-fill"></i> Skill2Career
        </a>
        <button class="navbar-toggler border-0 shadow-none" type="button" data-bs-toggle="collapse" data-bs-target="#navMenu">
            <i class="bi bi-list fs-2 text-secondary"></i>
        </button>
        <div class="collapse navbar-collapse" id="navMenu">
            <ul class="navbar-nav me-auto ms-lg-4 mb-2 mb-lg-0 gap-lg-1">
                <li class="nav-item">
                    <a class="nav-link px-2" href="/jobs"><i class="bi bi-grid me-1"></i> Browse Jobs</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link px-2" href="/live_jobs">
                        <span class="badge bg-danger rounded-pill me-1" style="font-size: 0.65rem;">LIVE</span> Online Openings
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link px-2" href="/matcher"><i class="bi bi-cpu me-1"></i> Skill Matcher</a>
                </li>
            </ul>

            <!-- Dynamic Auth & Theme Toggle -->
            <div class="d-flex gap-2 align-items-center mt-3 mt-lg-0">
                <button id="themeToggleBtn" class="theme-toggle-btn me-1" type="button" title="Toggle dark/light mode">
                    <i id="themeToggleIcon" class="bi bi-moon-stars"></i>
                </button>

                {% if session.student_email %}
                    <a href="/dashboard" class="btn btn-outline-custom btn-sm rounded-pill px-3 fw-semibold">
                        <i class="bi bi-person-check-fill me-1" style="color: var(--primary-light);"></i> Dashboard
                    </a>
                    <a href="/logout" class="btn btn-outline-danger btn-sm rounded-pill px-3 fw-semibold">
                        Logout
                    </a>
                {% else %}
                    <a href="/login" class="btn btn-outline-custom">
                        Sign In
                    </a>
                    <a href="/register" class="btn btn-primary-custom">
                        Register
                    </a>
                {% endif %}
            </div>
        </div>
    </div>
</nav>

<main class="py-4">
    {% block content %}{% endblock %}
</main>

<footer class="text-center">
    <div class="container">
        <p class="mb-0">Skill2Career Portal &bull; Professional Student Internship System</p>
    </div>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

<script>
    const themeBtn = document.getElementById('themeToggleBtn');
    const themeIcon = document.getElementById('themeToggleIcon');
    const htmlNode = document.documentElement;

    function applyTheme(theme) {
        htmlNode.setAttribute('data-bs-theme', theme);
        localStorage.setItem('theme', theme);
        if (theme === 'dark') {
            themeIcon.className = 'bi bi-sun-fill text-warning';
        } else {
            themeIcon.className = 'bi bi-moon-stars';
        }
    }

    const currentTheme = localStorage.getItem('theme') || 'light';
    applyTheme(currentTheme);

    themeBtn.addEventListener('click', () => {
        const active = htmlNode.getAttribute('data-bs-theme');
        applyTheme(active === 'dark' ? 'light' : 'dark');
    });
</script>
</body>
</html>
