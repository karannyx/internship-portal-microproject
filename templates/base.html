<!DOCTYPE html>
<html lang="en" data-bs-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Skill2Career | Student Skill Portal{% endblock %}</title>
    
    <!-- Prevent Theme Flicker Script -->
    <script>
        (function() {
            const savedTheme = localStorage.getItem('theme') || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
            document.documentElement.setAttribute('data-bs-theme', savedTheme);
        })();
    </script>

    <!-- Google Fonts & Icons -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <!-- Bootstrap 5.3 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        :root {
            --primary: #4f46e5;
            --primary-hover: #4338ca;
            --primary-soft: #eef2ff;
        }

        /* Light Theme Defaults */
        [data-bs-theme="light"] {
            --body-bg: #f1f5f9;
            --card-bg: #ffffff;
            --nav-bg: #ffffff;
            --border-subtle: #e2e8f0;
            --text-main: #334155;
            --text-heading: #0f172a;
        }

        /* Dark Theme Styles */
        [data-bs-theme="dark"] {
            --body-bg: #090d16;
            --card-bg: #111827;
            --nav-bg: #0f172a;
            --border-subtle: #1f2937;
            --text-main: #94a3b8;
            --text-heading: #f8fafc;
            --primary-soft: #1e1b4b;
        }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: var(--body-bg);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            transition: background-color 0.25s ease, color 0.25s ease;
        }

        .navbar-custom {
            background: var(--nav-bg);
            border-bottom: 1px solid var(--border-subtle);
            padding: 0.85rem 0;
            transition: background-color 0.25s ease, border-color 0.25s ease;
        }

        .navbar-brand {
            font-weight: 800;
            color: var(--primary) !important;
            letter-spacing: -0.5px;
        }

        .card-custom {
            background: var(--card-bg) !important;
            border-radius: 16px;
            border: 1px solid var(--border-subtle) !important;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
            transition: background-color 0.25s ease, border-color 0.25s ease;
        }

        .btn-primary-custom {
            background: var(--primary);
            color: white !important;
            border: none;
            font-weight: 600;
            border-radius: 10px;
            padding: 0.6rem 1.25rem;
            transition: all 0.2s ease;
        }

        .btn-primary-custom:hover {
            background: var(--primary-hover);
            transform: translateY(-1px);
        }

        .btn-theme-toggle {
            width: 38px;
            height: 38px;
            border-radius: 50%;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            border: 1px solid var(--border-subtle);
            background: var(--card-bg);
            color: var(--text-main);
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .btn-theme-toggle:hover {
            border-color: var(--primary);
            color: var(--primary);
        }

        footer {
            margin-top: auto;
            background: var(--nav-bg);
            border-top: 1px solid var(--border-subtle);
            padding: 1.5rem 0;
            font-size: 0.875rem;
            color: #64748b;
        }
    </style>
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-custom sticky-top">
    <div class="container">
        <a class="navbar-brand d-flex align-items-center gap-2" href="/">
            <i class="bi bi-briefcase-fill fs-4"></i> Skill2Career
        </a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navMenu">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navMenu">
            <ul class="navbar-nav me-auto ms-lg-4 mb-2 mb-lg-0 gap-lg-2">
                <li class="nav-item">
                    <a class="nav-link fw-semibold" href="/matcher"><i class="bi bi-cpu me-1"></i> Skill Matcher</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link fw-semibold" href="/jobs"><i class="bi bi-grid me-1"></i> Browse Jobs</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link fw-semibold" href="/live_jobs">
                        <span class="badge bg-danger rounded-pill me-1" style="font-size: 0.65rem;">LIVE</span> Online Openings
                    </a>
                </li>
            </ul>

            <!-- Right Navbar Items (Auth + Theme Toggle) -->
            <div class="d-flex gap-2 align-items-center">
                <!-- Dark Mode Toggle Button -->
                <button id="themeToggleBtn" class="btn-theme-toggle me-1" type="button" title="Toggle theme">
                    <i id="themeToggleIcon" class="bi bi-moon-stars-fill"></i>
                </button>

                {% if session.student_email %}
                    <span class="badge bg-body-tertiary text-primary border px-3 py-2 fw-semibold fs-6">
                        <i class="bi bi-person-circle me-1"></i> {{ session.student_name }}
                    </span>
                    <a href="/logout" class="btn btn-outline-danger rounded-pill px-3 fw-semibold">
                        Logout
                    </a>
                {% else %}
                    <a href="/login" class="btn btn-outline-secondary rounded-pill px-3 fw-semibold">
                        Login
                    </a>
                    <a href="/register" class="btn btn-primary-custom rounded-pill px-3">
                        <i class="bi bi-person-plus"></i> Student Sign Up
                    </a>
                {% endif %}

                <a href="/add_job" class="btn btn-dark rounded-pill px-3 d-none d-lg-block">
                    <i class="bi bi-plus-circle"></i> Post a Job
                </a>
            </div>
        </div>
    </div>
</nav>

<main class="py-4">
    {% block content %}{% endblock %}
</main>

<footer class="text-center">
    <div class="container">
        <p class="mb-0">Student Skill & Internship Portal &bull; Micro Project</p>
    </div>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

<!-- Dark Mode Persistence Logic -->
<script>
    const themeBtn = document.getElementById('themeToggleBtn');
    const themeIcon = document.getElementById('themeToggleIcon');
    const htmlNode = document.documentElement;

    function applyTheme(theme) {
        htmlNode.setAttribute('data-bs-theme', theme);
        localStorage.setItem('theme', theme);
        if (theme === 'dark') {
            themeIcon.className = 'bi bi-sun-fill text-warning';
        } else {
            themeIcon.className = 'bi bi-moon-stars-fill';
        }
    }

    // Initialize icon based on current state
    const currentTheme = htmlNode.getAttribute('data-bs-theme') || 'light';
    applyTheme(currentTheme);

    // Toggle on click
    themeBtn.addEventListener('click', () => {
        const active = htmlNode.getAttribute('data-bs-theme');
        applyTheme(active === 'dark' ? 'light' : 'dark');
    });
</script>
</body>
</html>
