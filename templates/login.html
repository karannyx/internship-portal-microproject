{% extends "base.html" %}
{% block title %}Login | Skill2Career{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-5">
            <div class="card card-custom p-5">
                <h3 class="fw-bold text-center mb-1">Welcome Back</h3>
                <p class="text-muted text-center small mb-4">Sign in using Firebase Auth</p>

                <div id="errorMessage" class="alert alert-danger py-2 small d-none"></div>

                <form id="loginForm">
                    <div class="mb-3">
                        <label class="form-label fw-semibold small">Email Address</label>
                        <input type="email" id="email" class="form-control" required>
                    </div>
                    <div class="mb-4">
                        <label class="form-label fw-semibold small">Password</label>
                        <input type="password" id="password" class="form-control" required>
                    </div>
                    <button type="submit" id="loginBtn" class="btn btn-primary-custom w-100 mb-3">Sign In</button>
                    <div class="text-center small">
                        Don't have an account? <a href="/register" class="text-decoration-none fw-bold">Register Here</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
  import { getAuth, signInWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-auth.js";

  const firebaseConfig = {
    apiKey: "AIzaSyD9BTtt9e8xNLjgZZg3onbVmpauo9S5y5c",
    authDomain: "skill2career-932d2.firebaseapp.com",
    projectId: "skill2career-932d2",
    storageBucket: "skill2career-932d2.firebasestorage.app",
    messagingSenderId: "27369538944",
    appId: "1:27369538944:web:9dd0d456f75bda54b86d65",
    measurementId: "G-WE5MKVWVEV"
  };

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);

  document.getElementById('loginForm').addEventListener('submit', (e) => {
      e.preventDefault();
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;
      const btn = document.getElementById('loginBtn');
      const errBox = document.getElementById('errorMessage');
      
      btn.innerHTML = "Authenticating...";
      errBox.classList.add('d-none');

      signInWithEmailAndPassword(auth, email, password)
          .then((userCredential) => {
              fetch('/sync_firebase', {
                  method: 'POST',
                  headers: {'Content-Type': 'application/json'},
                  body: JSON.stringify({ action: 'login', email: email })
              }).then(() => window.location.href = '/jobs');
          })
          .catch((error) => {
              btn.innerHTML = "Sign In";
              errBox.innerHTML = error.message.replace("Firebase: ", "");
              errBox.classList.remove('d-none');
          });
  });
</script>
{% endblock %}
